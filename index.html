  <h1>ランニング</h1>
  <p>走った距離と練習強度を振り返る、個人用のランニング記録アプリです。</p>
  <h2>記録の保存先</h2>
  <p>予定・実績・シューズ・心拍ゾーンはiPhone内に保存されます。詳しい取り扱いと記録の削除方法は、<a href="privacy.html">プライバシーポリシー</a>をご覧ください。</p>
  <h2 id="contact">お問い合わせ</h2>
  <p>不具合やご要望は、サポート用リポジトリのGitHub Issuesで受け付けます。公開の窓口なので、氏名・メールアドレス・心拍数・ラン記録や、それらが写ったスクリーンショットは投稿しないでください。</p>
  <p><a href="https://github.com/rmmbntyvn6-eng/runninglog-support/issues">GitHubで問い合わせる</a></p>
